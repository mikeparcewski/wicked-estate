[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored in-house tree-sitter grammar: a `path` dependency of wicked-estate-extract, not a workspace member.
exclude = ["crates/wicked-estate-extract/vendor/tree-sitter-rpg"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/mikeparcewski/wicked-estate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
wicked-estate-core = { path = "crates/wicked-estate-core", version = "0.1.0" }
wicked-estate-store = { path = "crates/wicked-estate-store", version = "0.1.0" }
