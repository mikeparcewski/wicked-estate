[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored tree-sitter grammars: `path` dependencies of wicked-estate-extract, not workspace
# members. Excluded so each can be published to crates.io by --manifest-path (see scripts/publish.sh).
exclude = [
  "crates/wicked-estate-extract/vendor/tree-sitter-rpg",
  "crates/wicked-estate-extract/vendor/tree-sitter-vb6",
  "crates/wicked-estate-extract/vendor/tree-sitter-vba",
  "crates/wicked-estate-extract/vendor/tree-sitter-vbscript",
  "crates/wicked-estate-extract/vendor/tree-sitter-cfml",
  "crates/wicked-estate-extract/vendor/tree-sitter-abl",
  "crates/wicked-estate-extract/vendor/tree-sitter-foxpro",
  "crates/wicked-estate-extract/vendor/tree-sitter-informix4gl",
  "crates/wicked-estate-extract/vendor/tree-sitter-lotusscript",
  "crates/wicked-estate-extract/vendor/tree-sitter-powerscript",
  "crates/wicked-estate-extract/vendor/tree-sitter-crystal-formula",
]

[workspace.package]
version = "0.16.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/mikeparcewski/wicked-estate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
wicked-estate-core = { path = "crates/wicked-estate-core", version = "0.16.1" }
wicked-estate-store = { path = "crates/wicked-estate-store", version = "0.16.1" }
quick-xml = { version = "0.40", features = ["serialize"] }
roxmltree = "0.21"
calamine = "0.25"

[profile.release]
strip = true
lto = true
codegen-units = 1
