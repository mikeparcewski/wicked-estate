[package]
name = "wicked-estate-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Knowledge engine: typed relations, cite-able recall, cross-store code↔knowledge differentiator."

[lib]
name = "wicked_estate_knowledge"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v7"] }
wicked-estate-core = { path = "../wicked-estate-core", version = "0.15.1" }
wicked-estate-store = { path = "../wicked-estate-store", version = "0.15.1" }
wicked-estate-retrieve = { path = "../wicked-estate-retrieve", version = "0.15.1" }
wicked-estate-memory-core = { path = "../wicked-estate-memory-core", version = "0.15.1" }
wicked-estate-overlay = { path = "../wicked-estate-overlay", version = "0.15.1" }

[features]
default = []
semantic = ["wicked-estate-retrieve/model2vec"]
semantic-bge = ["wicked-estate-retrieve/fastembed"]
