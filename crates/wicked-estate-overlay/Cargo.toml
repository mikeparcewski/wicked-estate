[package]
name = "wicked-estate-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Lane X — the xedge cross-store overlay + OverlayReader: GraphRead that unions a home engine with foreign engines at read time (the cross-store about-arm differentiator engine)."

[dependencies]
wicked-estate-core = { path = "../wicked-estate-core", version = "0.15.0" }
wicked-estate-store = { path = "../wicked-estate-store", version = "0.15.0", features = ["pool"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
