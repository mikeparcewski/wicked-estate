[package]
name = "wicked-estate-bench"
description = "Agent-eval benchmark harness for wicked-estate."
publish = false   # internal tooling — not published to crates.io
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wicked-estate-bench"
path = "src/main.rs"

[dependencies]
wicked-estate-core.workspace = true
wicked-estate = { path = "../wicked-estate", version = "0.0.1" }
wicked-estate-store = { path = "../wicked-estate-store", version = "0.0.1" }
wicked-estate-rank = { path = "../wicked-estate-rank", version = "0.0.1" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
