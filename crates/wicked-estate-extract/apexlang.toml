# APEXlang extraction data (estate#312, #313). Rules as data: the extractor in src/apexlang.rs
# reads this table; adding a row here needs no Rust change.
#
# Oracle does not publish what an `@reference` points to (the EBNF types every reference-taking
# property only as `COMPONENT`). The [[ref]] rows below were curated from the properties that occur
# in Oracle's generated applications (oracle/apex@fbe095e, oracle/skills@014cdb2) and checked against
# Oracle's own legacy SQL exports of the same applications (oracle/apexlang/ in the repo root).

# ── Application layout ───────────────────────────────────────────────────────────────────────────
# An application is a directory. A file's application root is the path before the LEFT-most
# directory whose remaining directories have one of these shapes (`*` = any one directory, a final
# `**` = any depth). An ancestor that only shares a name (`deployments/prod/app-a/pages/p1.apx`)
# does not fit a shape and is skipped. Any other `.apx` file is rooted at its own directory.
[layout]
boundary = [
    ["pages"],
    ["shared-components", "**"],
    ["supporting-objects", "**"],
    ["workspace-components", "*"],
    ["deployments"],
]

# Directories that scope the components declared in them. `path` is matched against the segments
# after the application root; `{id}` is the container's id (absent = a singleton), `*` matches any
# one segment. The
# container's own declaration (`theme universal-theme (` in theme.apx) IS the container node.
[[layout.container]]
path = ["shared-components", "themes", "{id}"]
kind = "theme"

[[layout.container]]
path = ["shared-components", "plugins", "*", "{id}"]
kind = "plugin"

# Supporting objects (install scripts, install-time substitutions) belong to the application's
# single `supportingObject`, which keeps `substitution APP_NAME` apart from the application's own.
[[layout.container]]
path = ["supporting-objects"]
kind = "supportingObject"

# ── Node kinds ───────────────────────────────────────────────────────────────────────────────────
# APEXlang kind -> wicked NodeKind (snake_case). Unlisted kinds become `Other(<kind>)`. Every node
# also carries `apexlang_kind` metadata.
[node_kind]
app = "module"

# ── Identity ─────────────────────────────────────────────────────────────────────────────────────
# A component's key is its declared id. Kinds listed under `qualifier` prefix it with a property
# value (`<value>/<id>`): two `templateOptionGroup display-mode` differ only by `templateType`, and
# references spell them `@region/display-mode`.
[identity.qualifier]
templateOptionGroup = "templateType"
customAttribute = "scope"

# Kinds declared without an id take their key from these properties (dotted paths, values joined
# with `/`, a leading `@` dropped). A sibling collision that remains gets `~2`, `~3` in document
# order and is flagged `apexlang_identity = "positional"`.
[identity.keyless]
displayColumn = ["column"]
sort = ["column"]
controlBreak = ["column"]
aggregate = ["column", "function"]
groupByColumn = ["column"]
groupBySort = ["column"]
groupByAggregate = ["aggregate.column"]
pivotColumn = ["column"]
pivotRowColumn = ["column"]
componentSetting = ["name"]
branch = ["name"]
databaseObject = ["owner", "type", "name"]
parameter = ["name"]
connection = ["name"]
participant = ["name"]
standardAttributeConfig = ["name"]

# ── References ───────────────────────────────────────────────────────────────────────────────────
# (owner kind, property path) -> target kind + scope. `owner = "*"` matches any owner; an exact
# owner row wins. The property path is the group/key chain inside the owning component
# (`layout.region`). `target = "-"` marks a reference that must never bind (its target lives
# outside the export or needs context this table cannot express).
#
# scope: "app"     anywhere in the application
#        "self"    under the owning component itself
#        "parent"  under the owning component's parent
#        "<kind>"  under the nearest enclosing component of that kind (page, region, ...)
#
# A property not listed here binds only if its slug names exactly one component in the application;
# a theme-relative `@/x` binds only through a row here, and only from inside a theme (the theme in
# use by a page is declared in another file, so a page's `@/x` never binds).

