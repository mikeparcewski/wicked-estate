[package]
name = "wicked-estate-tree-sitter-vbscript"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VBScript grammar for tree-sitter — vendored from JJK96/tree-sitter-vbscript"
readme = "README.md"
build = "bindings/rust/build.rs"
include = ["README.md", "bindings/rust/*.rs", "src/**/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"
