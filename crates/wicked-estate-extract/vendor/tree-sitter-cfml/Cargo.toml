[package]
name = "wicked-estate-tree-sitter-cfml"
version = "0.26.20"
edition = "2021"
license = "MIT"
description = "CFML (ColdFusion) grammar for tree-sitter — vendored from cfmleditor/tree-sitter-cfml (cfml tag + cfscript; cfquery SQL dialect omitted)"
build = "bindings/rust/build.rs"
include = ["bindings/rust/*.rs", "common/**/*", "cfml/grammar.js", "cfml/src/**/*", "cfscript/grammar.js", "cfscript/src/**/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"
