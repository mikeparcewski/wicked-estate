[package]
name = "wicked-estate-tree-sitter-vb6"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/mikeparcewski/wicked-estate"
description = "VB6 grammar for tree-sitter — vendored from joannefan/tree-sitter-vb6"
readme = "README.md"
build = "bindings/rust/build.rs"
include = ["LICENSE", "README.md", "bindings/rust/*.rs", "src/**/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"
