[package]
name = "wicked-estate-tree-sitter-vba"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/mikeparcewski/wicked-estate"
description = "VBA grammar for tree-sitter — vendored from tmepple/tree-sitter-vba"
readme = "README.md"
build = "bindings/rust/build.rs"
include = ["README.md", "bindings/rust/*.rs", "src/**/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"
