[package]
name = "wicked-estate-tree-sitter-vba"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VBA grammar for tree-sitter — vendored from tmepple/tree-sitter-vba"
build = "bindings/rust/build.rs"
include = ["bindings/rust/*.rs", "src/**/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"
