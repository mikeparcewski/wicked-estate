# ── W13 IaC language expansion ──────────────────────────────────────────────

[[language]]
# W13.2 Jinja2 templating — GCP Deployment Manager + Ansible templates.
name = "jinja2"
ext = ["j2", "jinja", "jinja2"]
grammar = "tree-sitter-jinja2"
tier = "structural"
caps = ["symbols", "imports"]

[[language]]
# W13.4 ARM Templates — Azure IaC (semantic overlay on tree-sitter-json).
# Extensions: .arm.json, azuredeploy.json (also matched via filename convention).
name = "arm"
ext = ["arm.json"]
grammar = "tree-sitter-json"
tier = "structural"
caps = ["symbols", "imports"]

# ── Visual Basic family (4 variants) ────────────────────────────────────────

[[language]]
# VB6 — Classic Visual Basic 6.0. Modules (.bas), Classes (.cls), Forms (.frm/.ctl).
name = "vb6"
ext = ["bas", "cls", "frm", "ctl"]
grammar = "tree-sitter-vb6"
tier = "structural"
caps = ["symbols", "calls"]

[[language]]
# VB.NET — .NET Visual Basic. Single .vb extension for all file kinds.
name = "vbnet"
ext = ["vb"]
grammar = "tree-sitter-vb-dotnet"
tier = "structural"
caps = ["symbols", "calls", "imports", "extends", "implements"]

[[language]]
# VBA — Visual Basic for Applications (Office macros). Exported files use .vba;
# .bas/.cls/.frm are shared with VB6 and default to vb6 for extension dispatch.
name = "vba"
ext = ["vba"]
grammar = "tree-sitter-vba"
tier = "structural"
caps = ["symbols", "calls"]

[[language]]
# VBScript — Windows Scripting Host / ASP Classic. .vbs and .wsf files.
name = "vbscript"
ext = ["vbs", "wsf"]
grammar = "tree-sitter-vbscript"
tier = "structural"
caps = ["symbols", "calls"]

[[language]]
# ColdFusion CFML (tag-based) — .cfm pages, tag-based .cfc components. Vendored from
# cfmleditor/tree-sitter-cfml. Captures <cffunction>/<cfcomponent> + embedded <cfscript>.
name = "cfml"
ext = ["cfm", "cfc"]
grammar = "tree-sitter-cfml"
tier = "structural"
caps = ["symbols", "calls"]

[[language]]
# ColdFusion CFScript — modern script-based CFML (.cfs). Same vendored grammar (cfscript dialect).
name = "cfscript"
ext = ["cfs"]
grammar = "tree-sitter-cfml"
tier = "structural"
caps = ["symbols", "calls"]

[[language]]
# Progress OpenEdge ABL (4GL) — in-house minimal grammar (upstream parser.c is ~97MB). .p/.w/.i;
# ABL classes (.cls) dispatch by language name since .cls is shared with apex/vb6.
name = "abl"
ext = ["p", "w", "i"]
grammar = "tree-sitter-abl"
tier = "structural"
caps = ["symbols", "calls"]
