# Secret-redaction policy (wicked-estate#405, DES-S7 §5). Rules as data: the redactor in
# src/redact.rs is generic; formats, trusted fields and exemptions live here.
#
# The index stores keys, references, and values from structurally trusted fields only. Every
# other config value is masked BEFORE the file is parsed, so content, node signatures and the
# full-text index all derive from the masked text. Masking is same-length (spans stay valid).
#
# Layers (DES-S7 §5):
#   C0 structural deny  [[structural_deny]]         values dropped, keys kept
#   C1 trusted fields   [[format.trust]]            the ONLY config values that may be stored
#   C2 shape validation value classes url/host/...  part of a trusted value may still be masked
#   C3 detectors        wicked_estate_core::redact  token shapes, encoded runs, entropy
#   C4 key-name deny    wicked_estate_core::redact  deny wins over C1
#   C5 references       [references]                ${VAR}, {{ .Values.x }} etc. are kept

# Files never indexed even when committed (matched against the file NAME, case-insensitive).
# `.env.example` / `.env.sample` / `.env.template` are not excluded, but dotenv files have no
# language row today, so they are not indexed either (their admission is X6a's).
[exclude]
names = [
  ".env", ".env.*", "*.env", ".npmrc", ".pypirc", ".netrc", "*.pem", "*.key",
  "*.p12", "*.pfx", "*.keystore", "*.jks",
]
allow = [".env.example", ".env.sample", ".env.template"]
# Name prefixes of secret files that ordinary modules share (`credentials_store.py`, `id_utils.ts`,
# `kubeconfig_loader.go`; wicked-estate#433). A match is excluded UNLESS it is source code: its
# final extension is in `code_ext` and no inner suffix is a config, prose or key format
# (`credentials.yaml.py`, `id_rsa.pem.ts` stay excluded). `code_ext` lists only languages whose
# code redactor is checked to mask a secret-named binding (redact.rs test
# `unless_code_languages_mask_secret_bindings`); a language not listed stays excluded under these
# names (shell, Clojure/EDN, Vue/Svelte, build files, COBOL/RPG: their secret-named values are
# not all caught).
# `id_rsa`, `id_ed25519.pub`, `credentials`, `credentials.json` / `.yaml` / `.toml` / `.ini` /
# `.tfvars` and `kubeconfig.yaml` stay excluded.
unless_code = ["id_*", "credentials*", "kubeconfig*"]
code_ext = [
  "py", "pyi", "js", "jsx", "mjs", "cjs", "ts", "tsx", "java", "kt", "kts", "go", "rs", "rb",
  "php", "cs", "swift", "scala", "c", "h", "cc", "cpp", "cxx", "hpp", "hh", "dart",
]

# C5: a value that is ENTIRELY one of these is a reference, never a secret value.
[references]
# Names and paths only: a reference carrying a literal default (`${VAR:-x}`) or an expression
# with literals (`{{ "x" }}`, `${{ a || 'x' }}`) holds a committed value and is NOT kept.
patterns = [
  '^\$\{[A-Za-z_][A-Za-z0-9_.]*\}$',
  '^\$\([A-Za-z_][A-Za-z0-9_]*\)$',
  '^\$[A-Za-z_][A-Za-z0-9_]*$',
  '^\{\{-?\s*\.[A-Za-z0-9_.]+(\s*\|\s*(quote|toString|toYaml|b64enc|nindent\s+[0-9]+|indent\s+[0-9]+|trim|lower|upper))*\s*-?\}\}$',
  '^\$\{\{\s*(secrets|vars|env|inputs|matrix|github|steps|needs|runner)\.[A-Za-z0-9_.\-]+\s*\}\}$',
  '^vault:[A-Za-z0-9_/\-.#]+$',
]

# Base-path words a URL path segment may keep without being known in the same file (C2).
# File types with no redaction rule (grammar-less mainframe formats, plugin grammars, rule-only
# files) get C3 plus the C4 `name=value` pass. Names that a C4 word matches but that are not
# secrets in those formats: JCL `DSN=` is a dataset name, not a database connection string.
[unruled]
not_secret_keys = ["DSN", "DSNAME"]

[url]
path_segments = ['api', 'v[0-9]{1,2}', 'rest', 'rpc', 'graphql', 'internal', 'public', 'ws']

# Env-style keys (a compose/k8s/Dockerfile environment entry, a ConfigMap data key): the key's
# suffix makes the value a CANDIDATE of a class; C2 decides what of it is kept.
[env_suffix]
url = ["_URL", "_URI", "_ENDPOINT", "_BASE_PATH"]
host = ["_HOST", "_ADDR", "_ADDRESS", "_SERVICE"]
port = ["_PORT"]
# Topics/queues are kept only when equal to a channel known in the same label; X0 knows no
# channels, so they are masked (a cross-repo topic configured only by env stays a boundary).
topic = ["_TOPIC", "_QUEUE", "_SUBJECT", "_EXCHANGE"]

# String-literal handling in code (every language with a grammar): the literal is masked when C3
# flags it or when it is bound to a C4-denied name. Literals inside these ancestor kinds are
# never masked (module specifiers are identities, not values).
[code]
# Module specifiers (never masked): the literal is this field of its parent node ...
module_fields = ["source", "path"]
# ... or its parent is one of these node kinds (PHP require/include expressions) ...
module_parent_kinds = ["require_expression", "require_once_expression", "include_expression", "include_once_expression"]
# ... or it is an argument of a call to one of these.
module_callees = ["require", "import", "require_relative", "load", "__import__", "importlib.import_module", "require.resolve"]
string_kind_substrings = ["string", "char_literal", "character_literal", "heredoc", "raw_str"]
# Inside an interpolated literal only these children are value text.
fragment_kind_substrings = ["fragment", "string_content", "escape", "str_text", "str_part", "str_end_part"]
number_kind_substrings = ["number", "integer", "float", "decimal"]
comment_kind_substrings = ["comment"]

# ── C0: structural deny ─────────────────────────────────────────────────────────────────────────
[[structural_deny]]
when = { root_key = "kind", equals = ["Secret"] }
paths = ["/data/**", "/stringData/**"]
[[structural_deny]]
when = { root_key = "kind", equals = ["SealedSecret"] }
paths = ["/spec/encryptedData/**"]
[[structural_deny]]
when = { file_glob = ["secrets*.yaml", "secrets*.yml", "secret*.json", "*secrets*.toml"] }
paths = ["/**"]

# ── Formats ─────────────────────────────────────────────────────────────────────────────────────
# Grammars that are config-like but have no tree mapping: every string literal is masked.
[default_deny]
grammars = ["kdl", "ron"]
# Document-tier grammars that are prose or code, not config (checked by a test so a newly wired
# config grammar cannot ship without a [[format]] row or a default_deny entry).
prose = ["html", "jsdoc", "postscript", "regex", "dot", "rego", "markdown"]

# A [[format]] maps a tree-sitter grammar onto the normalized document tree (pairs, lists,
# scalars) and lists its trusted fields. `grammar` is a languages.toml name. Kinds:
#   pair        node kind -> key field / value field (or key child kind / value child kind)
#   list        node kinds whose named children are list items (path segment "[]")
#   scalar      node kinds decided WHOLE (their children are never walked): a quoted string
#               whose only named children are escapes would otherwise leave its text unmasked
#   keep_leaf   named leaf kinds that are never value material (punctuation-like, comments,
#               identifiers in expression languages, booleans, nulls)
#   numeric     named leaf kinds masked as numbers (stays a valid number)
#   unkeyed     what to do with value leaves outside any pair: "mask" (default-deny),
#               "command" (command words, C3/C4 per token) or "c3" (kept unless C3 flags it)
#   key_from    a list item whose text is `KEY=value` (compose environment list form)
# A [[format.trust]] row: `paths` (/a/*/b, ** any depth, [] list item), `class`:
#   plain    kept unless C3 flags it
#   identity a source identity (repository / git / registry URL): userinfo, query and fragment
#            masked, every component C3-checked, never placeholder-substituted otherwise
#   integrity an artifact hash (sha512-...); kept when it has that shape
#   command  command words: C3 per token, C4-named flags and KEY=value tokens masked
#   env      an env-style value: its class comes from the key suffix ([env_suffix]); no suffix -> masked
#   url/host/port  C2 shape rules
# `files` (globs on the file name) or `detect` (a root key that must exist) select the format
# rows; the generic grammar row (no `files`/`detect`) applies to every file of that grammar.

[[format]]
name = "json"
grammar = "json"
pair = [{ kind = "pair", key = "key", value = "value" }]
list = ["array"]
scalar = ["string"]
keep_leaf = ["true", "false", "null", "comment", "escape_sequence"]
numeric = ["number"]
unkeyed = "mask"

[[format]]
name = "yaml"
grammar = "yaml"
pair = [{ kind = "block_mapping_pair", key = "key", value = "value" }, { kind = "flow_pair", key = "key", value = "value" }]
list = ["block_sequence", "flow_sequence"]
scalar = ["plain_scalar", "double_quote_scalar", "single_quote_scalar", "block_scalar"]
keep_leaf = ["boolean_scalar", "null_scalar", "comment", "anchor_name", "alias_name", "tag", "yaml_directive", "tag_directive", "reserved_directive", "document_start", "document_end"]
numeric = []
unkeyed = "mask"
key_from = { separator = "=" }
reference_tags = ["!Ref", "!GetAtt", "!ImportValue"]
bool_kinds = ["boolean_scalar", "null_scalar"]

[[format]]
name = "toml"
grammar = "toml"
pair = [{ kind = "pair", key_child = ["bare_key", "quoted_key", "dotted_key"], value_index = -1 }]
section = [{ kind = "table", key_child = ["bare_key", "quoted_key", "dotted_key"] }, { kind = "table_array_element", key_child = ["bare_key", "quoted_key", "dotted_key"], list = true }]
list = ["array"]
scalar = ["string"]
keep_leaf = ["boolean", "comment", "escape_sequence"]
numeric = ["integer", "float"]
unkeyed = "mask"

[[format]]
name = "hcl"
grammar = "hcl"
pair = [{ kind = "attribute", key_child = ["identifier"], value_index = -1 }, { kind = "object_elem", key = "key", value = "val" }]
list = ["tuple"]
# A heredoc is walked, not decided whole: its `<<EOT` / `EOT` delimiters stay, its
# template_literal lines are value material.
scalar = ["string_lit", "quoted_template"]
bool_kinds = ["bool_lit", "null_lit"]
keep_leaf = ["identifier", "comment", "template_interpolation_start", "template_interpolation_end", "heredoc_start", "heredoc_identifier", "quoted_template_start", "quoted_template_end", "escape_sequence"]
numeric = ["numeric_lit"]
# Block labels (resource "aws_s3_bucket" "name") are identities, not values.
unkeyed = "c3"

[[format]]
name = "ini"
grammar = "ini"
pair = [{ kind = "setting", key_child = ["setting_name"], value_child = ["setting_value"] }]
section = [{ kind = "section", key_child = ["section_name"] }]
list = []
keep_leaf = ["comment", "section_name", "text"]
numeric = []
unkeyed = "mask"

[[format]]
name = "dockerfile"
grammar = "dockerfile"
pair = [{ kind = "env_pair", key = "name", value = "value" }, { kind = "label_pair", key = "key", value = "value" }, { kind = "arg_instruction", key = "name", value = "default" }]
list = []
scalar = ["double_quoted_string", "single_quoted_string", "unquoted_string", "shell_command"]
# `COPY <<EOF /etc/x` / `ADD <<EOF`: the heredoc body is file content, not a command.
deny_subtree = ["copy_instruction/heredoc_block", "add_instruction/heredoc_block"]
keep_leaf = ["comment", "heredoc_end", "heredoc_marker"]
numeric = []
# FROM / RUN / CMD / EXPOSE ... are instructions, not config values.
unkeyed = "command"

# ── Trusted fields (C1) ─────────────────────────────────────────────────────────────────────────

# docker compose
[[trust]]
grammar = "yaml"
files = ["docker-compose*.yml", "docker-compose*.yaml", "compose*.yml", "compose*.yaml"]
rows = [
  { paths = ["/version", "/name", "/services/*/image", "/services/*/container_name", "/services/*/hostname", "/services/*/restart", "/services/*/build", "/services/*/build/context", "/services/*/build/dockerfile", "/services/*/build/target"], class = "plain" },
  { paths = ["/services/*/command", "/services/*/entrypoint", "/services/*/command/[]", "/services/*/entrypoint/[]"], class = "command" },
  { paths = ["/services/*/ports/[]", "/services/*/expose/[]", "/services/*/depends_on/[]", "/services/*/depends_on/*/condition", "/services/*/networks/[]", "/services/*/profiles/[]", "/services/*/labels/*", "/services/*/labels/[]"], class = "plain" },
  { paths = ["/services/*/environment/*", "/services/*/environment/[]"], class = "env" },
]
# service names a URL host may keep (C2 known identity in the same file)
known_hosts = ["/services/*"]

# Kubernetes (any YAML document with apiVersion + kind)
[[trust]]
grammar = "yaml"
detect = ["/apiVersion", "/kind"]
rows = [
  { paths = ["/apiVersion", "/kind", "/metadata/name", "/metadata/namespace", "/metadata/labels/*", "/spec/type", "/spec/replicas", "/spec/selector/**", "/spec/ports/[]/*", "/spec/template/metadata/labels/*", "/spec/ingressClassName"], class = "plain" },
  { paths = ["/**/containers/[]/name", "/**/containers/[]/image", "/**/containers/[]/imagePullPolicy", "/**/containers/[]/ports/[]/*", "/**/initContainers/[]/name", "/**/initContainers/[]/image"], class = "plain" },
  { paths = ["/**/containers/[]/command/[]", "/**/containers/[]/args/[]", "/**/initContainers/[]/command/[]", "/**/initContainers/[]/args/[]"], class = "command" },
  { paths = ["/**/env/[]/name", "/**/env/[]/valueFrom/**", "/**/envFrom/[]/**", "/**/volumes/[]/secret/secretName", "/**/volumes/[]/configMap/name", "/spec/tls/[]/secretName", "/spec/tls/[]/hosts/[]"], class = "plain" },
  { paths = ["/**/env/[]/value"], class = "env", key_sibling = "name" },
  { paths = ["/spec/rules/[]/host", "/spec/rules/[]/http/paths/[]/path", "/spec/rules/[]/http/paths/[]/pathType", "/spec/rules/[]/http/paths/[]/backend/**", "/spec/hostnames/[]", "/spec/parentRefs/[]/**", "/spec/rules/[]/matches/[]/**", "/spec/rules/[]/backendRefs/[]/**"], class = "plain" },
]
known_hosts = ["/metadata/name"]

# CloudFormation templates: resource types, dependencies and references are identities the IaC
# extractor reads (`Type`, `DependsOn`, `Ref`, `Fn::GetAtt`); every property VALUE stays masked.
[[trust]]
grammar = "yaml"
detect = ["/Resources"]
rows = [{ paths = ["/AWSTemplateFormatVersion", "/Resources/*/Type", "/Resources/*/DependsOn", "/Resources/*/DependsOn/[]", "/Parameters/*/Type", "/**/Ref", "/**/Fn::GetAtt", "/**/Fn::GetAtt/[]", "/**/Fn::ImportValue"], class = "plain" }]
[[trust]]
grammar = "json"
detect = ["/Resources"]
rows = [{ paths = ["/AWSTemplateFormatVersion", "/Resources/*/Type", "/Resources/*/DependsOn", "/Resources/*/DependsOn/[]", "/Parameters/*/Type", "/**/Ref", "/**/Fn::GetAtt", "/**/Fn::GetAtt/[]", "/**/Fn::ImportValue"], class = "plain" }]

# Kubernetes ConfigMap data keys are env-style
[[trust]]
grammar = "yaml"
detect = ["/kind=ConfigMap"]
rows = [{ paths = ["/data/*"], class = "env" }]

# npm package.json (the X1 linker's inputs: DES-S1 §2.1 provides/deps/entries, DES-S7 §2.3 run entries)
[[trust]]
grammar = "json"
files = ["package.json"]
rows = [
  { paths = ["/name", "/version", "/description", "/type", "/license", "/packageManager", "/main", "/module", "/types", "/typings", "/browser", "/bin", "/bin/*", "/exports", "/exports/**", "/imports/**", "/files/[]", "/workspaces/[]", "/workspaces/packages/[]", "/keywords/[]", "/engines/*", "/os/[]", "/cpu/[]", "/sideEffects", "/sideEffects/[]", "/publishConfig/access"], class = "plain" },
  { paths = ["/dependencies/*", "/devDependencies/*", "/peerDependencies/*", "/optionalDependencies/*", "/bundleDependencies/[]", "/overrides/**", "/resolutions/*", "/peerDependenciesMeta/**"], class = "identity" },
  { paths = ["/repository", "/repository/url", "/repository/type", "/repository/directory", "/homepage", "/bugs/url", "/bugs", "/funding/url", "/publishConfig/registry"], class = "identity" },
  { paths = ["/scripts/*"], class = "command" },
]

# package-lock.json and the installed-tree record node_modules/.package-lock.json
[[trust]]
grammar = "json"
files = ["package-lock.json", ".package-lock.json", "npm-shrinkwrap.json"]
rows = [
  { paths = ["/name", "/version", "/lockfileVersion", "/requires", "/packages/*/name", "/packages/*/version", "/packages/*/license", "/packages/*/engines/*", "/packages/*/bin/*", "/packages/*/os/[]", "/packages/*/cpu/[]"], class = "plain" },
  { paths = ["/packages/*/resolved", "/packages/*/dependencies/*", "/packages/*/devDependencies/*", "/packages/*/peerDependencies/*", "/packages/*/optionalDependencies/*", "/packages/*/peerDependenciesMeta/**", "/dependencies/**/version", "/dependencies/**/resolved", "/dependencies/**/requires/*"], class = "identity" },
  { paths = ["/packages/*/integrity", "/dependencies/**/integrity"], class = "integrity" },
]

# pnpm-workspace.yaml: workspace member patterns (the linker's `workspace:` membership, X1)
[[trust]]
grammar = "yaml"
files = ["pnpm-workspace.yaml"]
rows = [{ paths = ["/packages/[]"], class = "plain" }]

# tsconfig*.json (DES-S1 §2.3 tsconfig-outdir)
[[trust]]
grammar = "json"
files = ["tsconfig*.json", "jsconfig*.json"]
rows = [{ paths = ["/extends", "/extends/[]", "/compilerOptions/**", "/include/[]", "/exclude/[]", "/files/[]", "/references/[]/path"], class = "plain" }]

# Cargo.toml
[[trust]]
grammar = "toml"
files = ["Cargo.toml"]
rows = [
  { paths = ["/package/name", "/package/version", "/package/edition", "/package/description", "/package/license", "/package/rust-version", "/package/readme", "/package/publish", "/package/keywords/[]", "/package/categories/[]", "/package/build", "/package/workspace", "/package/*/workspace"], class = "plain" },
  { paths = ["/package/repository", "/package/homepage", "/package/documentation"], class = "identity" },
  { paths = ["/workspace/package/repository", "/workspace/package/homepage", "/workspace/package/documentation"], class = "identity" },
  { paths = ["/lib/*", "/bin/[]/*", "/test/[]/*", "/bench/[]/*", "/example/[]/*", "/workspace/members/[]", "/workspace/exclude/[]", "/workspace/default-members/[]", "/workspace/resolver", "/workspace/package/**", "/features/**", "/profile/**"], class = "plain" },
  { paths = ["/dependencies/**", "/dev-dependencies/**", "/build-dependencies/**", "/target/*/dependencies/**", "/target/*/dev-dependencies/**", "/target/*/build-dependencies/**", "/workspace/dependencies/**", "/patch/**", "/replace/**"], class = "identity" },
]

# pyproject.toml (PEP 621 + the path-source forms X1 reads: uv sources, poetry path deps)
[[trust]]
grammar = "toml"
files = ["pyproject.toml"]
rows = [
  { paths = ["/project/name", "/project/version", "/project/description", "/project/readme", "/project/requires-python", "/project/license", "/project/license/text", "/project/keywords/[]", "/project/classifiers/[]", "/project/dynamic/[]", "/project/scripts/*", "/project/gui-scripts/*", "/project/entry-points/**"], class = "plain" },
  { paths = ["/project/dependencies/[]", "/project/optional-dependencies/**", "/dependency-groups/**", "/project/urls/*"], class = "identity" },
  { paths = ["/build-system/**", "/tool/*/packages/**", "/tool/setuptools/**", "/tool/hatch/build/**", "/tool/uv/workspace/**", "/tool/poetry/name", "/tool/poetry/version", "/tool/poetry/packages/**", "/tool/poetry/scripts/*"], class = "plain" },
  { paths = ["/tool/uv/sources/**", "/tool/poetry/dependencies/**", "/tool/poetry/group/**"], class = "identity" },
]

# Dockerfile ENV / ARG / LABEL pairs are env-style
[[trust]]
grammar = "dockerfile"
rows = [{ paths = ["/*"], class = "env" }]

# ── Hosts that embed other languages ────────────────────────────────────────────────────────────
# Each block's body is redacted with the rules of the language its tag names (embedded.toml): a
# `const password = "..."` in an APEXlang `javascript-browser` block is masked exactly as in a .js
# file. (The C4 `name: value` check is NOT applied to APEXlang's own properties: it would mask
# `authorizationScheme: @admin` and every other `auth*` reference.)
[[embedded_host]]
grammar = "apexlang"
block = "fenced_block"
tag_field = "language"
body_field = "body"
