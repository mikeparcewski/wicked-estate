AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sample CloudFormation template for wicked-estate-extract IaC extraction tests.
  Contains two resources where one references the other via !Ref.

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-app-bucket
      VersioningConfiguration:
        Status: Enabled

  AppQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: my-app-queue
      # Reference to the bucket — used as a logical dependency marker
      Tags:
        - Key: BucketRef
          Value: !Ref AppBucket

Outputs:
  BucketName:
    Value: !Ref AppBucket
  QueueUrl:
    Value: !Ref AppQueue
