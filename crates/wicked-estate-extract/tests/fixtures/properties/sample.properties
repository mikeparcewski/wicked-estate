app.name=MyApplication
app.version=1.0.0
app.description=A sample Java application

server.host=localhost
server.port=8080
server.timeout=30000

db.url=jdbc:postgresql://localhost:5432/mydb
db.username=admin
db.password=secret
db.pool.min=2
db.pool.max=20

log.level=INFO
log.file=/var/log/myapp.log
log.rotation=daily

cache.enabled=true
cache.ttl=3600
cache.max-size=1000

feature.dark-mode=false
feature.beta-ui=true
