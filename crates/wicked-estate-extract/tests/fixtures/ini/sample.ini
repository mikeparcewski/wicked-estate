; sample.ini — wicked-estate daemon configuration
; Lines beginning with ';' or '#' are comments.

[general]
name            = wicked-estate
version         = 0.1.0
environment     = production
log_level       = info
pid_file        = /var/run/wicked-estate.pid
data_dir        = /var/lib/wicked-estate
config_dir      = /etc/wicked-estate
debug           = false
daemonize       = true

[server]
host            = 0.0.0.0
port            = 8080
read_timeout    = 30
write_timeout   = 30
shutdown_timeout = 10
max_connections = 1024
tls_enabled     = true
tls_cert        = /etc/ssl/certs/we.crt
tls_key         = /etc/ssl/private/we.key
tls_min_version = TLSv1.2

[database]
driver          = sqlite
path            = /var/lib/wicked-estate/graph.db
wal_mode        = true
busy_timeout_ms = 5000
max_connections = 16
cache_size_kb   = 65536
foreign_keys    = true
journal_mode    = WAL
synchronous     = NORMAL
auto_vacuum     = INCREMENTAL

[index]
root            = /workspace
workers         = 8
batch_size      = 512
follow_symlinks = false
max_file_size_kb = 4096
incremental     = true
poll_interval_secs = 60
exclude_patterns = target/**,node_modules/**,**/*.min.js,.git/**

[resolution]
tiers           = tags,import-map,tsg,scip
lsp_on_demand   = true
lsp_timeout_ms  = 2000
max_import_depth = 32

[retrieval]
fts_weight      = 0.6
graph_weight    = 0.4
max_results     = 25
max_context_chars = 24000
embeddings      = false
embeddings_url  = http://localhost:7890

[observability]
metrics_enabled = true
metrics_port    = 9090
metrics_path    = /metrics
tracing_enabled = true
tracing_exporter = otlp
tracing_endpoint = http://otel-collector:4317
tracing_sample_rate = 0.1
health_path     = /health
ready_path      = /ready
