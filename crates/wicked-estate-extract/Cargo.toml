[package]
name = "wicked-estate-extract"
description = "Tree-sitter and grammar-less source extractors for wicked-estate."
readme = "README.md"
keywords = ["tree-sitter", "code-graph", "parsing", "extraction", "llm"]
categories = ["development-tools", "parsing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wicked-estate-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tree-sitter = "0.25"
# Runtime language plugins: load drop-in tree-sitter grammars from a plugins dir at runtime
# (see src/plugin.rs). libloading is ISC-licensed and tree-sitter-language MIT — both MIT-compatible,
# so the core stays clean; the grammars themselves are separate artifacts, never linked in here.
libloading = "0.8"
tree-sitter-language = "0.1"
# Override-descriptor digests (ADR-010) — same digest family the indexer already uses.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# ABI-14 grammars — compatible with tree-sitter 0.24 (ABI 13-14 supported)
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"           # provides LANGUAGE_TYPESCRIPT + LANGUAGE_TSX
tree-sitter-javascript = "0.23.1"         # 0.23.1 = ABI 14; 0.25.x = ABI 15 (incompatible)
tree-sitter-go = "0.23.4"                 # 0.23.4 = ABI 14; 0.25.x = ABI 15 (incompatible)
tree-sitter-java = "0.23"
tree-sitter-c = "0.23.4"                  # 0.23.4 = ABI 14; 0.24.x = ABI 15 (incompatible)
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.21"              # 0.21.x = ABI 14 (old language() API); 0.23.x = ABI 15
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.23.3"               # 0.23.3 = ABI 14; 0.25.x = ABI 15 (incompatible)
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
# --- W2.1 batch 2: additional languages (ABI-14 probe) ---
tree-sitter-php = "0.23"
tree-sitter-scala = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-ocaml = "0.23"
tree-sitter-julia = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-elixir = "0.3"
# --- W2.1 batch 3 (ABI-14) ---
tree-sitter-haskell = "0.23"
tree-sitter-md = "0.3"
tree-sitter-nix = "0.3"
tree-sitter-r = "1.1"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-toml-ng = "0.7"
tree-sitter-swift = "0.7"                 # ABI 15 — wired now that the runtime is tree-sitter 0.25
# Legacy mainframe (user request, "if available"): NO usable tree-sitter crate exists.
#   - tree-sitter-cobol 0.1.0 is a STUB (only main.rs; no lib.rs / language binding / node-types).
#   - JCL / RPG / PL-I / Natural / REXX: no crate on crates.io at all.
# Path to cover them: VENDOR a grammar's C source + build.rs + a language() binding + <lang>.scm
# (the "grammar without a crate" route — fits the languages-as-data design, no core change). COBOL
# grammars exist on GitHub (e.g. yutaro-sakamoto/tree-sitter-cobol) and could be vendored on request.
# tree-sitter-hcl + tree-sitter-swift were ABI-15-deferred under the old 0.24 runtime. Now that the
# runtime is tree-sitter 0.25, HCL is wired via arborium-hcl and Swift via tree-sitter-swift 0.7
# (queries/swift.scm). Other ABI-15 grammars can follow the same path.
streaming-iterator = "0.1"
regex = "1"
# arborium grammar family (ABI-15, tree-sitter 0.25, uniform `language()` API) — W2.1 toward 73.
arborium-cobol = "2.18.0"
arborium-ada = "2.18"
arborium-awk = "2.18"
arborium-clojure = "2.18"
arborium-cmake = "2.18"
arborium-commonlisp = "2.18"
arborium-dart = "2.18"
arborium-dockerfile = "2.18"
arborium-elm = "2.18"
arborium-erlang = "2.18"
arborium-fish = "2.18"
arborium-fsharp = "2.18"
arborium-gleam = "2.18"
arborium-groovy = "2.18"
arborium-glsl = "2.18"
arborium-graphql = "2.18"
arborium-hcl = "2.18"
arborium-make = "2.18"
arborium-matlab = "2.18"
arborium-objc = "2.18"
arborium-perl = "2.18"
arborium-powershell = "2.18"
arborium-prolog = "2.18"
arborium-proto = "2.18"
arborium-sql = "2.18"
arborium-svelte = "2.18"
arborium-vue = "2.18"
arborium-zig = "2.18"
# arborium batch 2 — toward ≥73 total
arborium-hlsl = "2.18"
arborium-idris = "2.18"
arborium-ini = "2.18"
arborium-jq = "2.18"
arborium-jsdoc = "2.18"
arborium-just = "2.18"
arborium-kdl = "2.18"
arborium-lean = "2.18"
arborium-meson = "2.18"
arborium-ninja = "2.18"
arborium-postscript = "2.18"
arborium-regex = "2.18"
arborium-rego = "2.18"
arborium-rescript = "2.18"
arborium-ron = "2.18"
arborium-devicetree = "2.18"
# W9.3 Bicep + legacy/mainframe (user request): Fortran, Pascal, ABAP.
tree-sitter-bicep = "1.1"
tree-sitter-fortran = "0.6"
tree-sitter-pascal = "0.10"
# In-house grammar: free-format RPG IV (a symbols+calls subset). Source in vendor/tree-sitter-rpg.
wicked-estate-tree-sitter-rpg = { path = "vendor/tree-sitter-rpg", version = "0.1.3" }
# In-house grammar: Progress OpenEdge ABL (symbols+calls subset). The comprehensive upstream
# grammar (usagi-coffee/tree-sitter-abl) is a ~97MB parser.c — too large to vendor near the
# 100MiB git limit — so we author a minimal grammar instead. Source in vendor/tree-sitter-abl.
wicked-estate-tree-sitter-abl = { path = "vendor/tree-sitter-abl", version = "0.1.1" }
# In-house grammar: LotusScript (IBM Domino) — no upstream grammar exists. Source in vendor/tree-sitter-lotusscript.
wicked-estate-tree-sitter-lotusscript = { path = "vendor/tree-sitter-lotusscript", version = "0.1.1" }
# In-house grammar: Informix 4GL — no usable upstream grammar exists. Source in vendor/tree-sitter-informix4gl.
wicked-estate-tree-sitter-informix4gl = { path = "vendor/tree-sitter-informix4gl", version = "0.1.1" }
# In-house grammar: Visual FoxPro — no upstream grammar exists. Source in vendor/tree-sitter-foxpro.
wicked-estate-tree-sitter-foxpro = { path = "vendor/tree-sitter-foxpro", version = "0.1.1" }
# In-house grammar: PowerBuilder PowerScript — no upstream grammar exists. Source in vendor/tree-sitter-powerscript.
wicked-estate-tree-sitter-powerscript = { path = "vendor/tree-sitter-powerscript", version = "0.1.1" }
# In-house grammar: Crystal Reports formula language — no upstream grammar exists. Source in vendor/tree-sitter-crystal-formula.
wicked-estate-tree-sitter-crystal-formula = { path = "vendor/tree-sitter-crystal-formula", version = "0.1.1" }
# Visual Basic family — four variants.
wicked-estate-tree-sitter-vb6 = { path = "vendor/tree-sitter-vb6", version = "0.1.1" }        # vendored from joannefan/tree-sitter-vb6 (fixes Call keyword + empty bodies)
tree-sitter-vb-dotnet = "0.1.0"           # ABI-15; on crates.io
wicked-estate-tree-sitter-vba = { path = "vendor/tree-sitter-vba", version = "0.1.1" }        # ABI vendored from tmepple/tree-sitter-vba
wicked-estate-tree-sitter-vbscript = { path = "vendor/tree-sitter-vbscript", version = "0.1.1" }  # ABI vendored from JJK96/tree-sitter-vbscript
# ColdFusion CFML — vendored from cfmleditor/tree-sitter-cfml (cfml tag + cfscript; cfquery SQL dialect omitted). ABI 15.
wicked-estate-tree-sitter-cfml = { path = "vendor/tree-sitter-cfml", version = "0.26.21" }
# tree-sitter-abap-sqry deferred: it pins tree-sitter ^0.26 (we're on 0.25); would need another
# runtime bump for one niche SAP fork. ABAP coverage awaits a 0.26 bump or an ABI-≤15 ABAP grammar.
arborium-dot = "2.18"
arborium-elisp = "2.18"
# Long-tail coverage sweep — previously aspirational manifest rows, now wired (queries authored
# against each grammar's node-types.json). arborium (uniform ABI-15) preferred; dedicated
# tree-sitter crates where no arborium grammar exists.
arborium-solidity = "2.18"
arborium-thrift = "2.18"
arborium-verilog = "2.18"
arborium-vhdl = "2.18"
arborium-d = "2.18"
arborium-starlark = "2.18"
tree-sitter-cuda = "0.21"      # C++/CUDA fork, ABI 15
tree-sitter-arduino = "0.24"   # inherits tree-sitter-cpp node set, ABI 15
tree-sitter-sfapex = "3.0"     # Salesforce Apex (Java-shaped); language is in the `apex` submodule
tree-sitter-racket = "0.24"    # s-expression grammar; predicate-driven query
tree-sitter-jinja2 = "0.0.14"

# ── Cloud collector optional dependencies (feature-gated) ────────────────────
# None are pulled in by default; enable via --features cloud-aws / cloud-azure / cloud-gcp.

# AWS: Resource Explorer v2 (primary enumeration), EC2 + IAM (supplemental relationships).
aws-config                = { version = "1", optional = true }
aws-sdk-resourceexplorer2 = { version = "1", optional = true }
aws-sdk-ec2               = { version = "1", optional = true }
aws-sdk-iam               = { version = "1", optional = true }

# Azure: identity (DefaultAzureCredential) + management (Resource Graph / resource groups).
azure_identity            = { version = "1.0.0", optional = true }
azure_mgmt_resources      = { version = "0.21.0", optional = true }

# GCP: Cloud Asset Inventory (SearchAllResources) + Application Default Credentials.
google-cloud-asset-v1     = { version = "1.11.0", optional = true }
google-cloud-auth         = { version = "1.13.0", optional = true }

# tokio is required by all three cloud collectors (sync wrapper around async SDK calls).
tokio                     = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

# W15.2 XML rules extractor — DOM parsing for rules documents (DMN, Drools, BPMN, …).
quick-xml  = { workspace = true, optional = true }
roxmltree  = { workspace = true, optional = true }

# Pull in calamine only when the excel-rules feature is enabled.
calamine = { workspace = true, optional = true }

[features]
# Enable the real AWS cloud collector (aws-config + Resource Explorer v2 + EC2 + IAM).
cloud-aws   = ["dep:aws-config", "dep:aws-sdk-resourceexplorer2", "dep:aws-sdk-ec2",
               "dep:aws-sdk-iam", "dep:tokio"]
# Enable the real Azure cloud collector (azure_identity + azure_mgmt_resources).
cloud-azure = ["dep:azure_identity", "dep:azure_mgmt_resources", "dep:tokio"]
# Enable the real GCP cloud collector (google-cloud-asset-v1 + google-cloud-auth).
cloud-gcp   = ["dep:google-cloud-asset-v1", "dep:google-cloud-auth", "dep:tokio"]
# Convenience: enable all three cloud collectors.
cloud-all   = ["cloud-aws", "cloud-azure", "cloud-gcp"]
# W15.2 XML rules extractor — TOML path-config + roxmltree DOM traversal.
xml-rules   = ["dep:quick-xml", "dep:roxmltree"]
# W15.3 Excel/XLSX decision table extractor — calamine-backed.
excel-rules = ["dep:calamine"]
