[package]
name = "wicked-estate"
description = "Code + infrastructure estate graph for LLM agents: definitions, who-calls-X, blast-radius, scoped context."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/mikeparcewski/wicked-estate"
readme = "README.md"
keywords = ["code-graph", "llm", "tree-sitter", "code-intelligence", "mcp"]
categories = ["development-tools", "parsing", "command-line-utilities"]

[[bin]]
name = "wicked-estate"
path = "src/main.rs"

[dependencies]
wicked-estate-core.workspace = true
wicked-estate-store.workspace = true
wicked-estate-extract = { path = "../wicked-estate-extract", version = "0.15.1" }
wicked-estate-resolve = { path = "../wicked-estate-resolve", version = "0.15.1" }
wicked-estate-rank = { path = "../wicked-estate-rank", version = "0.15.1" }
wicked-estate-retrieve = { path = "../wicked-estate-retrieve", version = "0.15.1" }
wicked-estate-observe = { path = "../wicked-estate-observe", version = "0.15.1" }
anyhow.workspace = true
async-trait = "0.1"
dirs = "6"
ignore = "0.4"
rayon = "1"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

[features]
# Real semantic embeddings end-to-end for `index --embeddings` + `semantic`. Enable a tier
# (both may be on; FastEmbedder wins at runtime, else model2vec, else the lexical default):
fastembed = ["wicked-estate-retrieve/fastembed"]   # contextual ONNX/BGE — heaviest, highest quality
model2vec = ["wicked-estate-retrieve/model2vec"]   # static distilled — light, fast, configurable
serve = ["dep:tokio", "wicked-estate-store/pool"]  # enables open_async_store
# WICKED_RUNTIME=team (shared Postgres, decision #3): builds the PostgresStore factory arm
# into the CLI so a resolved postgres:// spec opens instead of erroring. Off by default —
# the local-first binary stays dependency-light (sqlx). See docs/team-runtime.md.
postgres = ["wicked-estate-store/postgres"]
# W15 rules engine — opt-in XML/Excel rules extractors wired into `index` dispatch.
# Off by default to keep the base binary dependency-light (roxmltree/quick-xml/calamine).
xml-rules = ["wicked-estate-extract/xml-rules"]     # Camunda DMN, Progress Corticon (.dmn/.ers/.erf/.ecore)
excel-rules = ["wicked-estate-extract/excel-rules"] # Excel/XLSX decision tables

[dev-dependencies]
tempfile = "3"
