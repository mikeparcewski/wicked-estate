[package]
name = "wicked-estate-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Memory engine: capture + conversational recall over a wicked-estate store (5-tier agent memory graph)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wicked-estate-core = { path = "../wicked-estate-core", version = "0.16.3" }
wicked-estate-store = { path = "../wicked-estate-store", version = "0.16.3" }
wicked-estate-retrieve = { path = "../wicked-estate-retrieve", version = "0.16.3" }
wicked-estate-memory-api = { path = "../wicked-estate-memory-api", version = "0.16.3" }
wicked-estate-memory-core = { path = "../wicked-estate-memory-core", version = "0.16.3" }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = { workspace = true }
wicked-estate-overlay = { path = "../wicked-estate-overlay", version = "0.16.3" }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
wicked-estate-overlay = { path = "../wicked-estate-overlay", version = "0.16.3" }
wicked-estate-store = { path = "../wicked-estate-store", version = "0.16.3", features = ["pool"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[features]
default = []
cross = ["dep:tokio", "wicked-estate-store/pool"]
postgres = ["wicked-estate-store/postgres"]
semantic = ["wicked-estate-retrieve/model2vec"]
semantic-bge = ["wicked-estate-retrieve/fastembed"]
