[package]
name = "wicked-estate-mcp"
description = "MCP server exposing the wicked-estate retrieval tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wicked-estate-mcp"
path = "src/main.rs"

[dependencies]
wicked-estate-core.workspace = true
wicked-estate-store.workspace = true
wicked-estate-retrieve = { path = "../wicked-estate-retrieve", version = "0.8.1" }
wicked-estate = { path = "../wicked-estate", version = "0.8.1", features = ["serve"] }
wicked-estate-observe = { path = "../wicked-estate-observe", version = "0.8.1" }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }

[dev-dependencies]
wicked-estate-store = { workspace = true }
