[package]
name = "wicked-estate-mcp"
description = "MCP server exposing the wicked-estate retrieval tools."
readme = "README.md"
keywords = ["mcp", "code-graph", "llm", "code-intelligence", "agents"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wicked-estate-mcp"
path = "src/main.rs"

# Optional semantic embedders — OFF by default so the standard build + the CI `gate` job stay
# offline and ML-dep-free (CLAUDE.md §9). They forward to the real optional deps: the binary picks
# its runtime embedder via `wicked_estate::default_embedder()` (FastEmbed → model2vec → hash) and
# also constructs `wicked_estate_retrieve::SemanticSearch`, so both crates must carry the flag.
# Declaring them here ALSO makes `#[cfg(feature = "…")]` in tests/conformance_schemas.rs an EXPECTED
# cfg; without the declaration the `unexpected_cfgs` lint fires and `RUSTFLAGS=-D warnings` (the gate)
# turns it into a hard build error. Build the semantic binary with:
#   cargo build -p wicked-estate-mcp --features fastembed   (see tests/conformance/capture.py)
[features]
fastembed = ["wicked-estate/fastembed", "wicked-estate-retrieve/fastembed"]
model2vec = ["wicked-estate/model2vec", "wicked-estate-retrieve/model2vec"]

[dependencies]
wicked-estate-core.workspace = true
wicked-estate-store.workspace = true
wicked-estate-retrieve = { path = "../wicked-estate-retrieve", version = "0.14.2" }
wicked-estate = { path = "../wicked-estate", version = "0.14.2", features = ["serve"] }
wicked-estate-observe = { path = "../wicked-estate-observe", version = "0.14.2" }
wicked-estate-memory = { path = "../wicked-estate-memory", version = "0.14.2" }
wicked-estate-knowledge = { path = "../wicked-estate-knowledge", version = "0.14.2" }
wicked-estate-memory-api = { path = "../wicked-estate-memory-api", version = "0.14.2" }
wicked-estate-memory-core = { path = "../wicked-estate-memory-core", version = "0.14.2" }
wicked-estate-overlay = { path = "../wicked-estate-overlay", version = "0.14.2" }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }

[dev-dependencies]
wicked-estate-store = { workspace = true }
tempfile = "3"
