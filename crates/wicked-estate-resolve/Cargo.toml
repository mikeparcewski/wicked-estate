[package]
name = "wicked-estate-resolve"
description = "Cross-file and cross-language reference resolvers for wicked-estate."
readme = "README.md"
keywords = ["code-graph", "name-resolution", "cross-language", "llm", "static-analysis"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wicked-estate-core.workspace = true
serde_json.workspace = true
serde = { workspace = true }
scip = "0.8"
protobuf = "3"

wicked-estate-observe = { path = "../wicked-estate-observe", version = "0.14.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wicked-estate-store = { path = "../wicked-estate-store", version = "0.14.0" }
tempfile = "3"

