[package]
name = "wicked-estate-observe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "OTLP HTTP exporter backend for wicked-estate"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "observability", "tracing", "wicked-estate"]
categories = ["development-tools"]

[dependencies]
wicked-estate-core = { workspace = true }
# rustls-tls (not the default native-tls) so the dependency tree carries NO openssl-sys — native-tls
# links the system OpenSSL on Linux, which cannot cross-compile to aarch64-unknown-linux-gnu (breaks
# the wicked-core-ts napi cross-build). rustls is pure-Rust and cross-compiles cleanly.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = { workspace = true }
