name: Release

# Bumps the workspace version, commits, tags, and pushes — which then triggers publish.yml.
#
# Usage: Actions → Release → Run workflow → enter version (e.g. 0.9.3)
# Prereq: the workflow runner needs write access to the repo (default for GITHUB_TOKEN on
# non-fork repos with "Allow GitHub Actions to create and approve pull requests" enabled).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.9.3)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: bump version, tag, push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: validate version input
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must be X.Y.Z, got: $NEW_VERSION" >&2
            exit 1
          fi

      - name: bump workspace version in Cargo.toml
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib
          new_ver = os.environ["NEW_VERSION"]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          # Find the current version in [workspace.package] and dependency pins.
          # All internal crate version pins use the same value as workspace.package.
          import re
          # Replace any version = "N.N.N" that matches a semver pattern.
          # Third-party deps use "1", "2", "1.85", etc. — only full semver gets replaced.
          updated = re.sub(
              r'(version\s*=\s*)"(\d+\.\d+\.\d+)"',
              lambda m: f'{m.group(1)}"{new_ver}"',
              text,
          )
          if updated == text:
              print("WARNING: no semver version strings found in Cargo.toml")
          p.write_text(updated)
          print(f"Bumped semver strings to {new_ver}")
          EOF

      # The Claude-plugin manifest carries its own version field outside Cargo's
      # reach — it shipped 0.13.1 across the 0.14.x/0.15.0 releases because
      # nothing bumped it. Sync it in the same release commit.
      - name: bump Claude-plugin manifest version
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          new_ver = os.environ["NEW_VERSION"]
          p = pathlib.Path("plugins/wicked-estate/.claude-plugin/plugin.json")
          data = json.loads(p.read_text())
          old = data["version"]
          # Surgical string replace (not json.dumps) to preserve formatting.
          text = p.read_text()
          needle = f'"version": "{old}"'
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one {needle!r} in {p}")
          p.write_text(text.replace(needle, f'"version": "{new_ver}"'))
          print(f"Bumped plugin manifest {old} -> {new_ver}")
          EOF

      - name: update Cargo.lock
        run: cargo check --workspace --quiet

      # The regex above rewrites ONLY the root Cargo.toml. The per-crate internal
      # pins (crates/*/Cargo.toml) are NOT synced by this workflow — if they have
      # drifted, publishing would fail MID-SEQUENCE after leaf crates are already
      # irreversibly live (caret semantics: ^0.15.0 excludes 0.16.0). This guard
      # goes red BEFORE the tag exists; bump the pins manually on a branch first.
      # plugin_manifest_version is the same guard for the Claude-plugin manifest
      # (belt to the bump step's braces — a red run here means the bump step and
      # the guard disagree, i.e. someone edited one path and not the other).
      - name: guard — internal version pins + plugin manifest in sync
        run: |
          cargo test -p wicked-estate --test version_pins
          cargo test -p wicked-estate --test plugin_manifest_version

      - name: commit and tag
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock plugins/wicked-estate/.claude-plugin/plugin.json
          git diff --cached --quiet || git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"
