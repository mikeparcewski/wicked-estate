name: Publish

# Fires when a version tag (e.g. v0.13.1) is pushed.
# Auth: crates.io Trusted Publishing (OIDC) — no stored CARGO_REGISTRY_TOKEN secret. The
# repo + this workflow must be registered as a Trusted Publisher on crates.io for each crate.
# NOTE: brand-new crate names may need a one-time token publish before a trusted publisher can
# be attached (crates.io, like npm, generally needs the crate to exist first).
# The script skips crates already at the tagged version, so re-running a failed/rate-limited
# publish is safe.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write        # required for crates.io Trusted Publishing (OIDC token exchange)

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish (resumable, rate-limit-aware)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish.sh
