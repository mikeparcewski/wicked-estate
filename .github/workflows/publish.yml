name: Publish

# Fires when a version tag (e.g. v0.13.1) is pushed.
#
# Auth: crates.io Trusted Publishing (OIDC). rust-lang/crates-io-auth-action exchanges this
# workflow's GitHub OIDC token (requires `id-token: write`) for a short-lived crates.io token,
# which cargo consumes via CARGO_REGISTRY_TOKEN; the action's post step revokes it when the job
# ends. Trusted-publisher binding attached to every published crate (as of v0.13.x: 25 crates —
# 14 core + 11 vendored tree-sitter grammars): repo mikeparcewski/wicked-estate, workflow
# publish.yml, no environment. Any crate added later needs the same binding.
#
# The minted token is short-lived; if a long run outlives it, later crates fail auth — just
# re-run the workflow: publish.sh skips crates already published at the tagged version, so
# re-runs are safe and resume where the run died.
#
# NOTE: the CARGO_REGISTRY_TOKEN repo secret still exists but is intentionally unused here.
# Delete it manually only AFTER the next release validates the OIDC publish end-to-end.
#
# Caveat: Trusted Publishing cannot authorize a crate name that doesn't exist on crates.io yet.
# A future brand-new crate needs a one-time token-auth bootstrap (see the 0.13.1 bootstrap in
# git history), then a trusted-publisher binding like the other 25.

# A tag push is the normal trigger, and workflow_dispatch is the RECOVERY one. v0.14.6 was tagged
# and pushed and this workflow never ran — zero runs for that ref — so the release sat unpublished
# on crates.io while the tag, the manifest and main all said 0.14.6. Nothing in the repo could fix
# that: the only trigger was a tag push, the tag already existed, and there was no prior run to
# re-run. The header's own advice ("just re-run the workflow") assumed a run existed.
#
# publish.sh already skips crates published at the tagged version, so dispatching against an
# existing tag is safe and idempotent — it publishes only what is genuinely missing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v0.14.6). Resolved as refs/tags/<input>; must already exist.'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# One run per tag at a time, never cancelled (#360): two overlapping runs for one tag would each
# rebuild the archives and --clobber them one by one, and could leave run B's archive next to run
# A's SHA256SUMS. A second dispatch waits for the first to finish.
concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write # mint the GitHub OIDC token exchanged for a crates.io publish token
      contents: read
    steps:
      # Check out the DISPATCHED tag when run by hand; the pushed tag otherwise.
      # TWO checkout steps, gated on the event, rather than one with a fallback expression.
      #
      # The first cut used `inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref`. An
      # empty or malformed input makes that whole expression fall through to `github.ref`, which on
      # a workflow_dispatch run is the DEFAULT BRANCH — so the recovery path could publish main
      # while appearing to publish a tag. `required: true` is a UI constraint; an API dispatch can
      # still send "".
      #
      # Gated steps cannot fall back: the dispatch path only ever checks out refs/tags/<input>, and
      # if that tag does not exist the checkout fails loudly, which is the correct outcome for a job
      # holding a crates.io OIDC publishing token.
      - name: check out the dispatched TAG (recovery path)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.ref }}
      - name: check out the pushed tag (normal path)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: authenticate with crates.io (OIDC trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1 (v1.0.5)
      - name: publish (resumable, rate-limit-aware)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish.sh

  # Prebuilt archives for five targets (wicked-estate#360), built from the same tag in PARALLEL with
  # the crates publish — they need nothing from crates.io, and the publish can run for hours. Each
  # leg smoke-tests its archive on its own OS (and Linux in clean distro containers) before it may
  # upload; a failed leg uploads nothing.
  binaries:
    name: prebuilt binaries
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

  # Cut the GitHub Release once crates.io publish SUCCEEDS. This is the step estate lacked: the
  # crates were published every release, but nothing created a GitHub Release, so the Releases page
  # drifted (it sat at v0.14.1 while crates.io shipped through v0.16.6). `needs: publish` means a
  # release is advertised only for a version that actually published — never a tag whose publish
  # failed. Idempotent: an existing release (e.g. a hand-backfilled one) is updated in place, so a
  # re-run / dispatch never errors on "already exists".
  #
  # #360: it also needs EVERY binaries leg, attaches the five archives plus SHA256SUMS, and attests
  # each archive's build provenance. A missing archive fails this job, so no release is created
  # or edited with a partial asset set. Uploads use --clobber, so a workflow_dispatch re-run for an
  # existing tag fills in whatever is missing, idempotently.
  github-release:
    name: create GitHub release
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release against the pushed tag
      id-token: write # sign the build-provenance attestations
      attestations: write
    steps:
      # The provenance attestation names the ref this RUN was started from. A recovery dispatch
      # started on `main` would attest archives built from the tag as coming from `main`, so
      # the release step refuses it (an empty ref is refused too): dispatch from the tag itself
      # ("Use workflow from: <tag>"). The crates publish above does not need this, so a
      # crates-only recovery from `main` still works.
      - name: a recovery dispatch must run from the tag it releases
        if: github.event_name == 'workflow_dispatch'
        env:
          WANT: refs/tags/${{ inputs.ref }}
          GOT: ${{ github.ref }}
        run: |
          if [ "$GOT" != "$WANT" ] || [ "$WANT" = "refs/tags/" ]; then
            echo "::error::dispatched from $GOT; release assets are attested only when the workflow runs from $WANT"
            exit 1
          fi
      # Same event-gated checkout as the publish job (a dispatch resolves the TAG input; a push
      # uses the pushed tag). An empty dispatch input already fails the publish job above, and
      # `needs: publish` gates this one on it, so this job never runs against a bad ref.
      - name: check out the dispatched TAG (recovery path)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.ref }}
      - name: check out the pushed tag (normal path)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: download every binaries leg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wicked-estate-*
          path: dist
          merge-multiple: true
      - name: require all five archives, write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu \
                   aarch64-unknown-linux-gnu; do
            ls wicked-estate-*-"$t".tar.gz >/dev/null || { echo "::error::missing archive for $t"; exit 1; }
          done
          ls wicked-estate-*-x86_64-pc-windows-msvc.zip >/dev/null \
            || { echo "::error::missing archive for x86_64-pc-windows-msvc"; exit 1; }
          [ "$(ls wicked-estate-* | wc -l)" -eq 5 ] || { echo "::error::expected exactly 5 archives"; ls; exit 1; }
          sha256sum wicked-estate-* > SHA256SUMS
          cat SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/wicked-estate-*'
      - name: create or update the GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"
          # Notes = this version's CHANGELOG section. Distinguish "no section" (exit 1 → generic
          # note) from a real script failure (exit 2 → missing/unreadable CHANGELOG, usage bug),
          # which must FAIL the release rather than silently ship a generic note.
          set +e
          python3 scripts/changelog-section.py "$TAG" > /tmp/relnotes.md
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            printf 'Release %s\n' "$TAG" > /tmp/relnotes.md
          elif [ "$code" -ne 0 ]; then
            echo "::error::changelog-section.py failed (exit $code) — refusing to publish a release with fallback notes"
            exit "$code"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/relnotes.md
            echo "updated existing GitHub Release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/relnotes.md --verify-tag
            echo "created GitHub Release $TAG"
          fi
          gh release upload "$TAG" dist/wicked-estate-* dist/SHA256SUMS --clobber
          echo "attached $(ls dist/wicked-estate-* | wc -l) archives + SHA256SUMS to $TAG"
