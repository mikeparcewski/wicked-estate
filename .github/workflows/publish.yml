name: Publish

# Fires when a version tag (e.g. v0.13.1) is pushed.
#
# TEMPORARY (0.13.1 bootstrap): token auth. The 5 memory/knowledge/overlay crates + mcp are brand-new
# crate names, and crates.io Trusted Publishing (OIDC) can't authorize a crate that doesn't exist yet
# — so the first full publish must use a plain API token. Set CARGO_REGISTRY_TOKEN (scopes:
# publish-new + publish-update) in repo Settings → Secrets → Actions.
#
# After 0.13.1 is live, restore OIDC (rust-lang/crates-io-auth-action, id-token: write) once trusted
# publishers are attached for publish.yml on all crates, and delete this secret.
#
# publish.sh skips crates already at the tagged version, so re-running a failed/rate-limited run is safe.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish (resumable, rate-limit-aware)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish.sh
