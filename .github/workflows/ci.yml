name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── The non-negotiable gate (CLAUDE.md §9): 0 warnings · clippy · all tests
  #    (incl. GraphStore conformance + bench-type tests) · fmt. Runs on the DEFAULT
  #    feature set, so it pulls no ML deps and needs no network. ─────────────────
  gate:
    name: gate (build · clippy · test · fmt)
    runs-on: ubuntu-latest
    env:
      # 0-warnings gate. Dependencies are compiled with --cap-lints=allow by cargo,
      # so this denies warnings in WORKSPACE crates only — exactly the bar we hold.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt --check
        run: cargo fmt --all -- --check
      - name: build (0 warnings, all targets)
        run: cargo build --workspace --all-targets
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (workspace + conformance + bench)
        run: cargo test --workspace

  # ── The Postgres backend is behind `--features postgres`, so NOTHING in the default
  #    `gate` job compiles it — `cargo build --workspace` does not enable optional
  #    features. `PostgresStore` therefore rotted silently when the `GraphStore` trait
  #    changed: `set_node_semantics` took a `ValidationClaim`, `SqliteStore` was updated,
  #    and Postgres kept the old `Option<bool>` for as long as nobody asked for the
  #    feature. It was caught only downstream, by wicked-core, whose CI does build it.
  #
  #    A locked decision says Postgres is a supported backend and every store must pass
  #    conformance; a backend no job compiles cannot honour that. This is compile-only —
  #    it needs no server, and the round-trip against a live Postgres stays in
  #    wicked-core's CI. ─────────────────────────────────────────────────────────────
  postgres-backend:
    name: postgres backend compiles (feature-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: clippy the postgres store
        run: cargo clippy -p wicked-estate-store --features postgres --all-targets -- -D warnings
      # The CLI's `postgres` feature is a one-line forward to the store's, but a forward no
      # job compiles can silently break — same rot class as the store itself (above). This
      # is what a WICKED_RUNTIME=team CLI build uses (docs/team-runtime.md).
      - name: clippy the CLI with the postgres feature (team-profile build)
        run: cargo clippy -p wicked-estate --features postgres --all-targets -- -D warnings

  # ── The compile guard above proves PostgresStore BUILDS; it does not prove it BEHAVES
  #    (#84). CLAUDE.md §9 makes the GraphStore conformance kit the thing every store MUST
  #    pass, and Postgres is a supported backend — so it needs the SAME suite run against a
  #    real server, not just a compile. `postgres_conformance.rs` was already written and
  #    skips gracefully when TEST_POSTGRES_URL is unset; nothing ran it. This lane
  #    provisions a live Postgres and runs it. It is a SEPARATE lane (like semantic-embedders)
  #    so the default `gate` stays offline + server-free. ─────────────────────────────────
  postgres-conformance:
    name: postgres backend round-trip (conformance)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wicked
          POSTGRES_PASSWORD: wicked
          POSTGRES_DB: estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wicked -d estate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: postgres-conformance
      # Runs postgres_conformance.rs::postgres_store_satisfies_graph_store_contract, which drops
      # the schema for a fresh start and drives the full graph_store_suite against PostgresStore.
      # TEST_POSTGRES_URL is what the test reads (NOT DATABASE_URL) — matching wicked-core's convention.
      - name: cargo test wicked-estate-store --features postgres (conformance against live Postgres, #84)
        env:
          TEST_POSTGRES_URL: postgres://wicked:wicked@localhost:5432/estate_test
        run: cargo test -p wicked-estate-store --features postgres

  # ── SurrealStore is behind `--features surrealdb`, so — exactly like Postgres above —
  #    NOTHING in the default `gate` compiles it. It rotted the same way, only worse,
  #    because no lane ever existed for it: the surrealdb 3.1.5 → 3.2.0 bump (#157)
  #    merged green while breaking every `surrealdb::Value` site, and by then the
  #    backend was already 15 `GraphRead`/`GraphWrite` methods behind the trait and
  #    predated the M4 contribution model. Its upserts used SurrealQL that never parsed,
  #    with the error swallowed — the store was silently writing nothing.
  #
  #    The engine is embedded (kv-mem), so unlike Postgres this needs no server: one
  #    lane runs clippy AND the full conformance kit (graph_store_suite incl. the #190
  #    depth-horizon case, traverse_multi, multi-file contributions). Any trait change
  #    that skips SurrealStore, and any dependabot bump that breaks it, now fails here
  #    instead of passing silently. ──────────────────────────────────────────────────
  surrealdb-backend:
    name: surrealdb backend (clippy · conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: surrealdb-backend
      - name: clippy the surrealdb store (-D warnings)
        run: cargo clippy -p wicked-estate-store --features surrealdb --all-targets -- -D warnings
      - name: conformance (graph_store_suite · traverse_multi · multi-file contributions)
        run: cargo test -p wicked-estate-store --features surrealdb --test surreal_conformance
      # The Surreal in-transaction rollback falsifier (TS-S2A) is a `#[cfg(test)]` lib test in
      # `surreal.rs`; `--test surreal_conformance` never runs it, so run the lib tests under the
      # feature too (the Postgres job above runs lib + integration in one `cargo test`).
      - name: store lib tests under the feature (surreal.rs rollback falsifier)
        run: cargo test -p wicked-estate-store --features surrealdb --lib

  # ── Public-API semver gate (#228). #222 added public fields to `Subgraph` (not
  #    `#[non_exhaustive]`) and changed `blast_radius_by_name`'s return type; a downstream probe
  #    crate compiled against the published 0.17.0 then failed with E0063 / E0027 against the merged
  #    tree, and nothing in CI noticed — a patch-numbered release could have published a break.
  #    cargo-semver-checks rustdocs every publishable workspace crate (bench is publish = false) and
  #    diffs it against the LAST VERSION ON CRATES.IO, failing on a breaking change the manifest
  #    version does not license (0.x: a minor bump licenses breaks, a patch bump does not).
  #    Advisory, not in the `required-checks` ruleset: a breaking PR is expected to land with the
  #    minor bump release.yml would otherwise cut, and this job is what says so before the tag.
  #    Default features only, like `gate`. ──────────────────────────────────────────────────────
  semver:
    name: semver (cargo-semver-checks vs last published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: semver-checks
      - name: cargo semver-checks (workspace, baseline = crates.io)
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: manual

  # ── Feature-gated semantic embedders. These tests download an embedding model on
  #    first run, so they CANNOT live in the default `gate` job (which must stay
  #    offline + dependency-free). This lane proves the semantic tiers keep working:
  #      * model2vec  — static distilled embeddings (light, no ONNX)
  #      * fastembed  — contextual ONNX/BGE embeddings (heavy)
  #    Each asserts related-but-zero-shared-token text embeds closer than unrelated
  #    text — the property the lexical default cannot satisfy. ────────────────────
  semantic-embedders:
    name: semantic embedders (model2vec · fastembed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cache downloaded embedding models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # model2vec-rs uses hf-hub (~/.cache/huggingface); fastembed caches under
          # ~/.cache/fastembed and/or a local .fastembed_cache. Models are immutable,
          # so a static key avoids re-downloading on every run.
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
            .fastembed_cache
          key: embedding-models-v1
      - name: model2vec semantic tests
        run: cargo test -p wicked-estate-retrieve --features model2vec
      - name: fastembed semantic tests
        run: cargo test -p wicked-estate-retrieve --features fastembed

  # ── TS-S3: the Angular compiler adapter (adapters/angular-evidence). Reinstalls the exact pinned
  #    compiler and re-derives every committed fixture envelope; a diff means a fixture is not the
  #    compiler's output (ADR-013). Also runs the adapter's own tests (version gate, paths). ────
  angular-adapter:
    name: angular adapter (fixtures re-derived · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/angular-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run fixtures:check
      - run: npm test
